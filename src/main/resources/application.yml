server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: SSO-project
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userDbSSOProject?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: "${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:root}}"
    password: "${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    jwt:
      secret-key: "3+kOi4rFKIYEvkL5ViNC0OvX9yIYBGsx6igcYz3mHkg="
      expiration: 3600000
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, profile, email
          github:
            client-id: ${GIT_CLIENT_ID}
            client-secret: ${GIT_CLIENT_SECRET}
            scope: read:user, user:email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: public_profile, email
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.springframework.web: DEBUG