<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Set a new password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="card">
    <div class="brand">S</div>
    <div class="card-header center">
        <h1>Set a new password</h1>
        <p class="subtitle">Choose a strong password you haven't used before.</p>
    </div>

    <div th:if="${error}" class="alert alert-error" th:text="${error}">error</div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}">success</div>

    <form th:action="@{/reset-password}" method="post" th:unless="${success}">
        <input type="hidden" name="token" th:value="${token}">

        <div class="field">
            <label for="password">New password</label>
            <input type="password" id="password" name="password"
                   autocomplete="new-password" minlength="6" maxlength="20" required>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword"
                   autocomplete="new-password" minlength="6" maxlength="20" required>
        </div>
        <button type="submit" class="btn">Update password</button>
    </form>

    <p class="footer-link" th:if="${success}">
        <a th:href="@{/login}">Back to sign in</a>
    </p>
</main>
</body>
</html>
