<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="card">
    <div class="brand">S</div>
    <div class="card-header center">
        <h1>You're signed in</h1>
        <p class="subtitle">Welcome to your account</p>
    </div>

    <div class="info-panel">
        <span class="label">Signed in as</span>
        <span class="value" sec:authentication="name">user</span>
    </div>
    <div class="info-panel">
        <span class="label">Role</span>
        <span class="value" sec:authentication="principal.authorities">[ROLE_USER]</span>
    </div>
    <a th:href="@{/profile}" class="btn btn-secondary">View profile</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-secondary">Sign out</button>
    </form>
</main>
</body>
</html>
